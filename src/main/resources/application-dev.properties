spring.application.name=cmarket_order_service

# DEV

app.debug-mode=true
server.port=8091
debug=true

spring.jpa.hibernate.ddl-auto=none

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

spring.messages.basename=languages/messages

# DATABASE DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=TRACE

# LOGGER
logging.level.root=info
logging.file.name=app.log
logging.file.path=logs

# KAFKA
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

#spring.kafka.consumer.properties.spring.json.trusted.packages=com.chris.cmarket.Order.Event
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.type.mapping=\
com.chris.cmarket.Order.Event.PlaceOrderEvent:com.chris.cmarket_order_service.Order.Event.PlaceOrderEvent